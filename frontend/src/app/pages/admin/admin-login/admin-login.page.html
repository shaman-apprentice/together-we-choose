<mat-card appearance="outlined" class="card">
	<mat-card-header>
		<mat-card-title>Admin Login</mat-card-title>
	</mat-card-header>
	<mat-card-content>
		<form [formGroup]="form" (ngSubmit)="submit()">
			<mat-form-field appearance="outline" class="field">
				<mat-label>Password</mat-label>
				<input matInput type="password" formControlName="password" autocomplete="current-password" required>
				@if (passwordInvalid()) {
					<mat-error>Password is required.</mat-error>
				}
			</mat-form-field>

			@if (error()) {
				<mat-error>{{ error() }}</mat-error>
			}

			<button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || isSubmitting()">
				@if (isSubmitting()) {
					Logging in…
				} @else {
					Login
				}
			</button>
		</form>
	</mat-card-content>
</mat-card>
